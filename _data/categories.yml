Hack Smarter Lab:
  description: >-
    This series covers all the free labs on HackSmarter, walking through my full trial-and-error process.

    Want writeups for the premium labs and ranges too? I currently can't afford a subscription, so if you'd like to help fund it, your support would be huge! I always want to keep educational content free and accessible for everyone.

    Thanks for the support—happy hacking, keep learning, and enjoy!
